name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip project
        run: |
          unzip -o kaamdost.zip -d temp_unzip
          ls -la temp_unzip
          INNER=$(find temp_unzip -name "settings.gradle*" | head -n 1 | xargs -r dirname)
          if [ -z "$INNER" ]; then INNER=temp_unzip; fi
          echo "Found in $INNER"
          cp -r $INNER/. .
          ls -la

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          grad
